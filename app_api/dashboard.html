<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIT 管理平台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { body { background: #101014; color: #e8e8ea; } }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; width: 340px; max-width: 100%; font-size: 14px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card { flex: 1 1 150px; background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) { .card { background: #1e1e24; } }
  .card .k { font-size: 12px; color: #888; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) { table { background: #1e1e24; } }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #eee; }
  @media (prefers-color-scheme: dark) { th, td { border-bottom: 1px solid #2a2a30; } }
  th { background: #fafafa; color: #666; font-weight: 500; }
  @media (prefers-color-scheme: dark) { th { background: #26262c; color: #aaa; } }
  .mono { font-variant-numeric: tabular-nums; }
  .ok { color: #16a34a; } .bad { color: #dc2626; }
  .logbox { background: #101014; color: #d0d0d0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 12px; border-radius: 10px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .pill { display:inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; }
  .pill.synced { background: #dbeafe; color: #1d4ed8; }
  .pill.local { background: #f3f4f6; color: #6b7280; }
  @media (prefers-color-scheme: dark) { .pill.synced { background: #1e3a5f; color: #93c5fd; } .pill.local { background: #2a2a30; color: #9ca3af; } }
</style>
</head>
<body>
<h1>MIT 管理平台</h1>
<div class="bar">
  <input id="token" type="password" placeholder="管理员 X-API-Token" autocomplete="off">
  <button onclick="load()">刷新</button>
  <span class="hint">Token 只存你浏览器本地</span>
</div>
<div id="err" class="err"></div>

<div class="cards" id="cards" style="display:none"></div>

<div id="users" style="display:none">
  <h2>所有用户消耗</h2>
  <table><thead><tr><th>用户 ID</th><th>Token 消耗</th><th>翻页数</th><th>最后活跃</th></tr></thead><tbody id="usersBody"></tbody></table>
</div>

<div id="books" style="display:none">
  <h2>书库总览</h2>
  <table><thead><tr><th>书名</th><th>状态</th><th>页数</th><th>已翻</th><th>失败</th><th>Token</th></tr></thead><tbody id="booksBody"></tbody></table>
</div>

<div id="log" style="display:none">
  <h2>healthdog 操作日志</h2>
  <div class="logbox" id="logBox"></div>
</div>

<script>
const tokenInput = document.getElementById('token');
tokenInput.value = localStorage.getItem('mit_token') || '';
tokenInput.oninput = () => localStorage.setItem('mit_token', tokenInput.value);

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTok(n) { n = Number(n)||0; return n >= 1000000 ? (n/1000000).toFixed(2)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n); }
function card(k, v) { return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }

async function load() {
  const token = tokenInput.value.trim();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  if (!token) { errEl.textContent = '请先填管理员 X-API-Token'; return; }
  try {
    const r = await fetch('/v1/admin/overview', { headers: { 'X-API-Token': token } });
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 ? '（Token 不对）' : ''));
    render(await r.json());
  } catch (e) { errEl.textContent = '加载失败：' + e.message; }
}

function render(d) {
  const s = d.stats || {};
  const cards = document.getElementById('cards');
  cards.style.display = 'flex';
  cards.innerHTML =
    card('总 Token', fmtTok(s.tokens)) +
    card('总翻页数', fmtTok(s.pages)) +
    card('已完成页', fmtTok(s.done_pages)) +
    card('失败页', fmtTok(s.failed_pages)) +
    card('书数', fmtTok(s.books));

  const users = d.users || [];
  if (users.length) {
    document.getElementById('users').style.display = 'block';
    document.getElementById('usersBody').innerHTML = users.map(u =>
      `<tr><td class="mono">${esc(u.id)}</td><td class="mono">${fmtTok(u.token_used)}</td><td class="mono">${fmtTok(u.page_count)}</td><td class="mono">${String(u.last_active_at||'').slice(0,16)}</td></tr>`
    ).join('');
  }

  const books = d.books || [];
  if (books.length) {
    document.getElementById('books').style.display = 'block';
    document.getElementById('booksBody').innerHTML = books.map(b => {
      const pill = b.synced ? '<span class="pill synced">已同步</span>' : '<span class="pill local">本地</span>';
      return `<tr><td>${esc(b.title)}</td><td>${pill}</td><td class="mono">${b.pages||0}</td><td class="mono ok">${b.done_pages||0}</td><td class="mono bad">${b.failed_pages||0}</td><td class="mono">${fmtTok(b.tokens)}</td></tr>`;
    }).join('');
  }

  const lines = d.ops_log || [];
  if (lines.length) {
    document.getElementById('log').style.display = 'block';
    document.getElementById('logBox').textContent = lines.join('\n');
  }
}

if (tokenInput.value) load();
</script>
</body>
</html>
